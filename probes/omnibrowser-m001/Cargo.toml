[workspace]
members = [
  "packages/bootstrap-smoke",
  "packages/core-common",
  "packages/core-object",
  "packages/core-action",
  "packages/core-task",
  "packages/core-artifact",
  "packages/runtime-control",
  "packages/event-runtime",
  "packages/module-kernel"
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde", "v4"] }
