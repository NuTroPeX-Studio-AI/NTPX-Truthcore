name: OmniBrowser M002 Exact Workspace Probe

on:
  push:
    branches:
      - omnibrowser/m002-exact-workspace-probe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: probes/omnibrowser-m001
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Locked metadata
        run: cargo metadata --locked --no-deps --format-version 1 > /tmp/m002-exact-metadata.json
      - name: Canonical format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: RustSec audit
        run: cargo audit --file Cargo.lock
      - name: Persist canonical exact workspace source and lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probes/omnibrowser-m001/Cargo.lock \
            probes/omnibrowser-m001/packages/runtime-control/src/lib.rs \
            probes/omnibrowser-m001/packages/event-runtime/src/lib.rs \
            probes/omnibrowser-m001/packages/module-kernel/src/lib.rs
          if git diff --cached --quiet; then
            echo "Exact workspace source and lockfile already canonical."
          else
            git commit -m "probe: persist canonical exact M002 workspace [skip ci]"
            git push origin HEAD:omnibrowser/m002-exact-workspace-probe
          fi
