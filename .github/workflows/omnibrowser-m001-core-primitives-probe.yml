name: OmniBrowser M001 Core Primitives Probe

on:
  push:
    branches:
      - omnibrowser/m001-core-primitives-probe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-core-primitives:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: probes/omnibrowser-m001
    steps:
      - name: Checkout exact probe branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: omnibrowser/m001-core-primitives-probe
      - name: Setup Rust 1.98.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - name: Generate dependency lock
        run: cargo generate-lockfile
      - name: Validate workspace metadata
        run: cargo metadata --locked --no-deps > /dev/null
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit and contract tests
        run: cargo test --workspace --locked
      - name: Documentation build
        run: cargo doc --workspace --no-deps --locked
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Dependency vulnerability audit
        run: cargo audit --file Cargo.lock
      - name: Persist validated lockfile
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(probe): persist M001 validated Cargo.lock [skip ci]"
          git push origin HEAD:omnibrowser/m001-core-primitives-probe
