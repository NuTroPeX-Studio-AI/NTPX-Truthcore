name: OmniBrowser Canonical Cutover Probe

on:
  push:
    branches:
      - omnibrowser/canonical-repo-cutover-probe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: probes/omnibrowser-m001
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Locked metadata
        run: cargo metadata --locked --no-deps --format-version 1 > /tmp/omnibrowser-cutover-metadata.json
      - name: Canonical format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: RustSec audit
        run: cargo audit --file Cargo.lock
      - name: Confirm canonical source
        working-directory: .
        run: |
          git diff --exit-code -- probes/omnibrowser-m001/Cargo.lock probes/omnibrowser-m001/packages/runtime-control/src/lib.rs probes/omnibrowser-m001/packages/event-runtime/src/lib.rs probes/omnibrowser-m001/packages/module-kernel/src/lib.rs
