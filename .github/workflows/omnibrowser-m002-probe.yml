name: OmniBrowser M002 Runtime Probe

on:
  push:
    branches:
      - omnibrowser/m002-runner-probe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: probes/omnibrowser-m002
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Metadata
        run: cargo metadata --locked --no-deps --format-version 1 > /tmp/m002-metadata.json
      - name: Canonical format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: RustSec audit
        run: cargo audit --file Cargo.lock
      - name: Persist canonical source and lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probes/omnibrowser-m002/Cargo.lock probes/omnibrowser-m002/packages/*/src/lib.rs
          if git diff --cached --quiet; then
            echo "No canonicalization changes to persist."
          else
            git commit -m "probe: persist canonical M002 source [skip ci]"
            git push origin HEAD:omnibrowser/m002-runner-probe
          fi
