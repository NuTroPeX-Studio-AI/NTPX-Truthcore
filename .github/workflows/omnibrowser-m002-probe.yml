name: OmniBrowser M002 Runtime Probe

on:
  push:
    branches:
      - omnibrowser/m002-runner-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: probes/omnibrowser-m002
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Metadata
        run: cargo metadata --locked --no-deps --format-version 1 > /tmp/m002-metadata.json
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: RustSec audit
        run: cargo audit --file Cargo.lock
