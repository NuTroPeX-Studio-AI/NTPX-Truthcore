name: Release Candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build unsigned release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace
      - name: Upload Android release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ntpx-truthcore-android-v1.0.0-rc1-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  web-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Web tests
        working-directory: web
        run: npm test
      - name: Web syntax checks
        working-directory: web
        run: npm run check
      - name: Build deployment container
        run: docker build -t ntpx-truthcore-web:1.0.0-rc1 ./web
      - name: Package deployment source
        run: tar -czf ntpx-truthcore-web-v1.0.0-rc1.tgz web
      - name: Upload web release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ntpx-truthcore-web-v1.0.0-rc1
          path: ntpx-truthcore-web-v1.0.0-rc1.tgz
          if-no-files-found: error
