name: OmniBrowser M000 Lockfile Persistence

on:
  push:
    branches:
      - omnibrowser/m000-runner-probe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist-lockfiles:
    name: Persist validated lockfiles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: probes/omnibrowser-m000
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: omnibrowser/m000-runner-probe
      - name: Setup Node 24.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Setup pnpm 11.21.0
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.21.0
          run_install: false
      - name: Setup Rust 1.98.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.98.0'
      - name: Generate lockfiles
        run: |
          pnpm install --lockfile-only
          cargo generate-lockfile --manifest-path core/Cargo.toml
          cargo generate-lockfile --manifest-path tauri/Cargo.toml
      - name: Commit lockfiles
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml core/Cargo.lock tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo 'Lockfiles already persisted.'
            exit 0
          fi
          git commit -m "chore(probe): persist validated lockfiles [skip ci]"
          git push origin HEAD:omnibrowser/m000-runner-probe
